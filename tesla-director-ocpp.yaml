# tesla-director.yaml

substitutions:
  global_max_current: "48"      # The circuit maximum for all twc
  global_twc_max_current: "32"  # The circuit maximum per twc
  master_addr: "0xF00D"         # The 2 byte address of the TWC director
  twc_0_name: "Slot 0"          # twc 1 Friendly Name
  twc_0_addr: "0x1234"          # twc 1 address for consistent mapping
  twc_0_initial_current: "15"   # twc 1 Initial Current
  twc_0_max_current: "32"       # twc 1 Max Current (upper bound)

esphome:
  name: tesla-director-ocpp
  friendly_name: Tesla-Director-OCPP
  project:
    name: "twc-director.Tesla Wall Connector Director"
    version: "v0.2.0-safe"
  on_boot:
    priority: 200
    then:
      - output.turn_on: tcan485_boost_en        # GPIO16, 5V boost power
      - output.turn_on: tcan485_rs485_shutdown  # GPIO19, shutdown disable (HIGH = enable)
      - output.turn_on: tcan485_rs485_re        # GPIO17, receiver enable
      - delay: 100ms                            # Let RS-485 transceiver stabilize
      # Safety: do NOT auto-enable master mode. Turn on "Master Mode" in HA
      # only when the bus is ready and you intend to control TWCs.
      - number.set:
          id: twc_0_max_current_num
          value: ${twc_0_max_current}
      - number.set:
          id: twc_0_initial_current_num
          value: ${twc_0_initial_current}
      # Session current stays 0 until you raise it or charging starts
  on_shutdown:
    then:
      - output.turn_off: tcan485_boost_en       # Disable GPIO16 before reset to avoid boot hang

esp32:
  board: esp32dev
  framework:
    type: esp-idf
  # ESPHome 2026.7+ uses native ESP-IDF toolchain by default.
  # Uncomment if compile fails with the native toolchain:
  # toolchain: platformio

# Local component tree in this repo (preferred for development).
# For HA Device Builder after push, switch to git source pointing at your fork:
# external_components:
#   - source:
#       type: git
#       url: https://github.com/itoaa/twc-director.git
external_components:
  - source:
      type: local
      path: components

logger:
  level: VERBOSE
  initial_level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret tesla_director_api_key

ota:
  - platform: esphome
    password: !secret tesla_director_ota_password

safe_mode:
  boot_is_good_after: 60s
  num_attempts: 5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Tesla-Director Fallback Hotspot"
    password: !secret wifi_hotspot_password

# Web UI over plain HTTP only (ESPHome has no built-in HTTPS on the device).
# Do NOT enable auth: on HTTP — Basic/Digest credentials or challenges still
# travel on an unencrypted channel; Basic even puts the password in Base64.
# Prefer: no auth + trusted LAN / IoT VLAN, or terminate TLS at a reverse proxy
# and put auth there. See README "Web UI security".
web_server:
  port: 80
  # auth:   # only if you terminate HTTPS in front of the device
  #   type: digest
  #   username: !secret web_username
  #   password: !secret web_password

captive_portal:
    
# UART on the RS-485 transceiver
uart:
  id: twc_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  stop_bits: 1
  parity: NONE

output:
  # Boost power supply enable (BOOST_ENABLE_PIN 16)
  - platform: gpio
    id: tcan485_boost_en
    pin: GPIO16

  # MAX13487E shutdown pin (RS485_SHUTDOWN_PIN 19) - HIGH = enable
  - platform: gpio
    id: tcan485_rs485_shutdown
    pin: GPIO19

  # MAX13487E RE pin (RS485_RE_PIN 17) — HIGH = receive enable
  - platform: gpio
    id: tcan485_rs485_re
    pin: GPIO17

select:
  - platform: logger
    name: Tesla Director log level
    disabled_by_default: true

twc_director:
  id: twc_component
  uart_id: twc_uart
  addr: ${master_addr}
  global_max_current: ${global_max_current}
  global_twc_max_current: ${global_twc_max_current}
  master_mode:
    id: twc_master_mode
  charging_count:
  link_ok:
    name: RS-485 Link
  evse:
    - name: ${twc_0_name}
      #address: ${twc_0_addr}
      twc_online:
      firmware_version:
      meter_current_phase_a:
        name: ${twc_0_name} Current
      meter_current_phase_b:
        disabled_by_default: true
      meter_current_phase_c:
        disabled_by_default: true
      meter_energy_session:
      meter_energy_total:
      meter_voltage_phase_a:
        name: ${twc_0_name} Voltage
      meter_voltage_phase_b:
        disabled_by_default: true
      meter_voltage_phase_c:
        disabled_by_default: true
      serial_number:
      vehicle_connected:
      vehicle_vin:
      contactor:
      contactor_status:
      available_current_sensor:
      max_current:
        id: twc_0_max_current_num
      max_current_sensor:
      initial_current:
        id: twc_0_initial_current_num
      session_current:
      session_current_sensor:
      mode:
      status_text:
      status_log:


# OCPP PoC — enabled:true links MicroOCPP (CI: fetch_deps + compile).
# Default tesla-director.yaml stays OCPP-free. Secrets via !secret only.
# HA entities override URL/id/key/ca_cert and can disable without rebuild.
ocpp_client:
  id: twc_ocpp
  enabled: true
  twc_director_id: twc_component
  csms_url: !secret ocpp_csms_url
  charge_point_id: !secret ocpp_charge_point_id
  authorization_key: !secret ocpp_authorization_key
  fail_safe_amps: 6
  # TLS: verify by default (crt_bundle). For RFC1918 lab self-signed PoC only:
  # allow_insecure_tls: true
  # Prefer: ca_cert: !secret ocpp_lab_ca_pem
  # Lab cleartext identification (CitrineOS ws://…:8081/<id>) — remove after wss:
  # allow_cleartext_ws: true
  connected:
    name: OCPP CSMS Connected
  connection_state:
    name: OCPP Connection State
  last_applied_amps:
    name: OCPP Last Applied Global Max
  enable_switch:
    name: OCPP Enable
  csms_url_text:
    name: OCPP CSMS URL
  charge_point_id_text:
    name: OCPP Charge Point ID
  authorization_key_text:
    name: OCPP Authorization Key
  ca_cert_text:
    name: OCPP CA Cert
  fail_safe_button:
    name: "OCPP återställ till fail-safe"
  allow_remote_start:
    name: OCPP Allow RemoteStart (lab)
  allow_remote_stop:
    name: OCPP Allow RemoteStop (lab)
  allow_reset:
    name: OCPP Allow Reset (lab)
  allow_unlock:
    name: OCPP Allow Unlock (lab)
