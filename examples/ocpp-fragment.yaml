# Example fragment — merge into a director YAML (not used by default CI).
# Secrets via !secret only. Runtime HA entities can override URL/id/key/ca_cert
# and enable/disable without reflash. Lab remote-* flags DEFAULT OFF.

ocpp_client:
  id: twc_ocpp
  enabled: false                 # compile default; HA enable_switch can start later if linked
  twc_director_id: twc_component
  csms_url: !secret ocpp_csms_url          # wss:// preferred; ws:// needs allow_cleartext_ws
  charge_point_id: !secret ocpp_charge_point_id
  authorization_key: !secret ocpp_authorization_key
  fail_safe_amps: 6                        # applied on CSMS disconnect / RemoteStop/Reset; ≤ hard cap
  # TLS (CISO): verify by default. Prefer lab CA for self-signed.
  # allow_insecure_tls: true               # lab PoC only; RFC1918 / .local hosts only
  # allow_cleartext_ws: true               # lab LAN only; ws://10.x… ; remove after wss handoff
  # ca_cert: !secret ocpp_lab_ca_pem
  # crt_bundle_attach: true                # default

  # Status
  connected:
    name: OCPP CSMS Connected
  connection_state:
    name: OCPP Connection State
  last_applied_amps:
    name: OCPP Last Applied Global Max

  # Runtime control (no rebuild)
  enable_switch:
    name: OCPP Enable
  csms_url_text:
    name: OCPP CSMS URL
  charge_point_id_text:
    name: OCPP Charge Point ID
  authorization_key_text:
    name: OCPP Authorization Key
  ca_cert_text:
    name: OCPP CA Cert                 # paste PEM; state is set (N bytes), never raw PEM
  fail_safe_button:
    name: "OCPP återställ till fail-safe"

  # Lab remotes — DEFAULT OFF. Enabling against public cloud CSMS needs new risk accept.
  allow_remote_start:
    name: OCPP Allow RemoteStart (lab)
  allow_remote_stop:
    name: OCPP Allow RemoteStop (lab)
  allow_reset:
    name: OCPP Allow Reset (lab)
  allow_unlock:
    name: OCPP Allow Unlock (lab)
