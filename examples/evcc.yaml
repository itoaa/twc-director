# Exempel: evcc.yaml-avsnitt för TWC Director
#
# Kopiera in chargers- och loadpoints-blocken i din evcc.yaml
# (eller använd dem som enda innehåll om du konfigurerar resten i evcc:s webbgränssnitt).
#
# Byt uri mot din egen Home Assistant-adress.
# Lägg inte in hemligheter eller hemmains IP-adresser i git.
#
# Nyare evcc autentiserar Home Assistant med OAuth i webbgränssnittet
# (eller via http://supervisor/core när evcc körs som Home Assistant-app).
# Äldre evcc kan kräva ett long-lived access token under varje laddare:
#   token: <long-lived access token>
# Skapa tokenet i Home Assistant-profilen. Lägg aldrig ett riktigt token i git.
#
# Se docs/evcc-setup.md för steg-för-steg (webbgränssnitt och fil).

chargers:
  - name: twc_s22_garage_inne
    type: template
    template: homeassistant
    uri: http://homeassistant.local:8123  # byt mot din egen Home Assistant-adress
    # token: <long-lived access token>  # endast äldre evcc; lägg aldrig i git
    status: sensor.s22_garage_inne_state_charge
    enabled: switch.s22_garage_inne_evcc_charging_enabled
    enable: switch.s22_garage_inne_evcc_charging_enabled
    setMaxCurrent: number.s22_garage_inne_evcc_current_limit
    power: sensor.s22_garage_inne_meter_power
    energy: sensor.s22_garage_inne_meter_energy_total
    currentL1: sensor.s22_garage_inne_meter_current_l1
    currentL2: sensor.s22_garage_inne_meter_current_l2
    currentL3: sensor.s22_garage_inne_meter_current_l3
    voltageL1: sensor.s22_garage_inne_meter_voltage_l1
    voltageL2: sensor.s22_garage_inne_meter_voltage_l2
    voltageL3: sensor.s22_garage_inne_meter_voltage_l3
  - name: twc_s22_garage_ute
    type: template
    template: homeassistant
    uri: http://homeassistant.local:8123  # byt mot din egen Home Assistant-adress
    # token: <long-lived access token>  # endast äldre evcc; lägg aldrig i git
    status: sensor.s22_garage_ute_state_charge
    enabled: switch.s22_garage_ute_evcc_charging_enabled
    enable: switch.s22_garage_ute_evcc_charging_enabled
    setMaxCurrent: number.s22_garage_ute_evcc_current_limit
    power: sensor.s22_garage_ute_meter_power
    energy: sensor.s22_garage_ute_meter_energy_total
    currentL1: sensor.s22_garage_ute_meter_current_l1
    currentL2: sensor.s22_garage_ute_meter_current_l2
    currentL3: sensor.s22_garage_ute_meter_current_l3
    voltageL1: sensor.s22_garage_ute_meter_voltage_l1
    voltageL2: sensor.s22_garage_ute_meter_voltage_l2
    voltageL3: sensor.s22_garage_ute_meter_voltage_l3

loadpoints:
  - title: S22 Garage Inne
    charger: twc_s22_garage_inne
    phases: 3
    mincurrent: 6
    maxcurrent: 15
  - title: S22 Garage Ute
    charger: twc_s22_garage_ute
    phases: 3
    mincurrent: 6
    maxcurrent: 15
