name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ${{ matrix.yaml }} / ESPHome ${{ matrix.esphome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - yaml: tesla-director.yaml
            esphome: "2026.7.3"
            ocpp: false
          - yaml: tesla-director.yaml
            esphome: "latest"
            ocpp: false
          # Prove ocpp_client builds with enabled:true + MicroOCPP (fetch_deps).
          - yaml: tesla-director-ocpp.yaml
            esphome: "2026.7.3"
            ocpp: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI secrets
        run: |
          cat > secrets.yaml <<'SECRETS'
          wifi_ssid: "ci-ssid"
          wifi_password: "ci-password-123456"
          wifi_hotspot_password: "ci-hotspot-123456"
          tesla_director_api_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          tesla_director_ota_password: "ci-ota-password"
          web_username: "ci"
          web_password: "ci-web-password"
          ocpp_csms_url: "wss://ocpp.example.invalid/ocpp/CP001"
          ocpp_charge_point_id: "CP001"
          ocpp_authorization_key: "ci-ocpp-key"
          SECRETS
          # Strip accidental leading indentation from the heredoc above
          sed -i 's/^[[:space:]]*//' secrets.yaml
          cat secrets.yaml

      - name: Fetch OCPP vendor deps
        if: matrix.ocpp
        run: ./components/ocpp_client/scripts/fetch_deps.sh

      - name: Build firmware
        id: build
        uses: esphome/build-action@v8.0.0
        with:
          yaml-file: ${{ matrix.yaml }}
          version: ${{ matrix.esphome }}

      - name: Firmware size (OCPP)
        if: matrix.ocpp
        run: |
          set -euo pipefail
          echo "::group::Firmware size / RAM hints"
          echo "build-action outputs:"
          echo '${{ toJSON(steps.build.outputs) }}'
          # Common locations from esphome/build-action / PlatformIO
          find . -type f \( -name '*.bin' -o -name 'firmware.map' -o -name '*size*.txt' \) \
            ! -path './.git/*' 2>/dev/null | head -80 || true
          echo "---- bin sizes ----"
          find . -type f -name '*.bin' ! -path './.git/*' -printf '%s %p\n' 2>/dev/null | sort -nr | head -20 || true
          echo "---- ESPHome / PIO memory lines (if present in outputs dir) ----"
          if [ -d .esphome ]; then
            rg -n "RAM:|Flash:|Used|DRAM|IRAM|memory" .esphome -g '*.txt' -g '*.log' 2>/dev/null | head -40 || true
          fi
          if [ -d .pio ]; then
            rg -n "RAM:|Flash:|Used|DRAM|IRAM" .pio -g '*.txt' -g '*.map' 2>/dev/null | head -40 || true
          fi
          # Also scan GitHub Action workspace output from build-action
          if [ -d "${{ runner.temp }}" ]; then
            find "${{ runner.temp }}" -name '*.bin' -printf '%s %p\n' 2>/dev/null | sort -nr | head -10 || true
          fi
          echo "::endgroup::"
