name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Host unit tests (C core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and run tests
        run: make -C tests test

  compile:
    name: Compile ESPHome ${{ matrix.esphome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        esphome:
          - "2026.7.3"
          - "latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "ci-ssid"
          wifi_password: "ci-password-123456"
          wifi_hotspot_password: "ci-hotspot-123456"
          tesla_director_api_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          tesla_director_ota_password: "ci-ota-password"
          web_username: "ci"
          web_password: "ci-web-password"
          EOF
          # Strip accidental leading indentation from the heredoc above
          sed -i 's/^[[:space:]]*//' secrets.yaml
          cat secrets.yaml

      # tesla-director.yaml pins external_components to git ref: main for
      # production flashes. CI must compile this PR's own component, or new
      # YAML keys are rejected against the already-merged schema.
      - name: Point YAML at the local component
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tesla-director.yaml")
          t = p.read_text()
          old = """  - source:
      type: git
      url: https://github.com/itoaa/twc-director.git
      ref: main
    components: [twc_director]
    refresh: 0s"""
          new = """  - source:
      type: local
      path: components"""
          if t.count(old) != 1:
              raise SystemExit(f"external_components block not unique ({t.count(old)})")
          p.write_text(t.replace(old, new))
          PY

      - name: Build firmware
        uses: esphome/build-action@v8.0.0
        with:
          yaml-file: tesla-director.yaml
          version: ${{ matrix.esphome }}
