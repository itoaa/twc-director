name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ${{ matrix.yaml }} / ESPHome ${{ matrix.esphome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - yaml: tesla-director.yaml
            esphome: "2026.7.3"
          - yaml: tesla-director.yaml
            esphome: "latest"
          # Prove ocpp_client loads with enabled: false (no MicroOCPP link).
          - yaml: tesla-director-ocpp.yaml
            esphome: "2026.7.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI secrets
        run: |
          cat > secrets.yaml <<'SECRETS'
          wifi_ssid: "ci-ssid"
          wifi_password: "ci-password-123456"
          wifi_hotspot_password: "ci-hotspot-123456"
          tesla_director_api_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          tesla_director_ota_password: "ci-ota-password"
          web_username: "ci"
          web_password: "ci-web-password"
          ocpp_csms_url: "wss://ocpp.example.invalid/ocpp"
          ocpp_charge_point_id: "CI-CP001"
          ocpp_authorization_key: "ci-ocpp-auth-key-not-real"
          SECRETS
          # Strip accidental leading indentation from the heredoc above
          sed -i 's/^[[:space:]]*//' secrets.yaml
          cat secrets.yaml

      - name: Build firmware
        uses: esphome/build-action@v8.0.0
        with:
          yaml-file: ${{ matrix.yaml }}
          version: ${{ matrix.esphome }}
