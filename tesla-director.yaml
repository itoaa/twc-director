# tesla-director.yaml
#
# Reference config for the setup this firmware is developed on:
#   Wemos D1 mini ESP32 + MAX485 module (3.3 V), 2x Gen2 Tesla Wall Connector (3-phase, Sweden)
#
#   ESP32 GPIO22 (TX) -> MAX485 DI
#   ESP32 GPIO21 (RX) <- MAX485 RO
#   ESP32 GPIO18      -> MAX485 DE + RE (tied together)  == twc_director: flow_control_pin
#   MAX485 VCC = 3.3 V, GND shared with the Wall Connectors, A/B to TWC A/B (120 ohm at bus ends)
#
# Do NOT use GPIO1 / GPIO3 for RS-485: they are UART0 (USB serial / boot log) and the
# USB-UART chip drives them, which corrupts frames (checksum errors).
#
# flow_control_pin belongs under twc_director:, NOT under uart:.
#
# Using a LilyGO T-CAN485 instead? See tesla-director-safe.yaml (it keeps the
# GPIO16/17/19 power/enable outputs and omits flow_control_pin).
#
# Secrets: copy secrets.yaml.example to secrets.yaml and fill in real values.

substitutions:
  global_max_current: "15"      # cap: hela slingan (säkring minus marginal)
  global_twc_max_current: "15"  # cap: per TWC (kabel/box)
  master_addr: "0xF00D"
  twc_0_name: "Slot 0"
  twc_0_initial_current: "6"
  twc_0_max_current: "15"
  twc_1_name: "Slot 1"
  twc_1_initial_current: "6"
  twc_1_max_current: "15"

esphome:
  name: tesla-director
  friendly_name: Tesla-Director
  project:
    name: "twc-director.Tesla Wall Connector Director"
    version: "v0.3.0"
  on_boot:
    priority: 200
    then:
      # Slå inte på master mode här. evcc_offered_current startar på 0 A.
      - number.set:
          id: twc_0_cap_max_current
          value: ${twc_0_max_current}
      - number.set:
          id: twc_0_cap_initial_current
          value: ${twc_0_initial_current}
      - number.set:
          id: twc_1_cap_max_current
          value: ${twc_1_max_current}
      - number.set:
          id: twc_1_cap_initial_current
          value: ${twc_1_initial_current}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/itoaa/twc-director.git
      ref: main
    components: [twc_director]
    refresh: 0s
  # Local checkout instead (development):
  # - source:
  #     type: local
  #     path: components

logger:
  level: VERBOSE
  initial_level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: !secret tesla_director_api_key

ota:
  - platform: esphome
    password: !secret tesla_director_ota_password

safe_mode:
  boot_is_good_after: 60s
  num_attempts: 5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tesla-Director Fallback Hotspot"
    password: !secret wifi_hotspot_password

# Produktion: ta bort web_server (se tesla-director-safe.yaml).
# Aktivera aldrig auth: över vanlig HTTP, se README "Web UI security".
web_server:
  port: 80

captive_portal:

sensor:
  - platform: uptime
    name: "Uptime"

  - platform: wifi_signal
    id: wifi_signal_sensor
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: template
    name: "WiFi Strength"
    lambda: |-
      if (id(wifi_signal_sensor).state > -55)  return {"Excellent"};
      else if (id(wifi_signal_sensor).state > -70) return {"Good"};
      else if (id(wifi_signal_sensor).state > -85) return {"OK"};
      else return {"Weak"};
    update_interval: 60s
    icon: "mdi:wifi"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    mac_address:
      name: "MAC Address"

# D1 mini ESP32 + MAX485: DI=GPIO22, RO=GPIO21, DE+RE=GPIO18, VCC=3,3 V
# (no flow_control_pin here - it goes under twc_director:)
uart:
  id: twc_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  stop_bits: 1
  parity: NONE

twc_director:
  id: twc_component
  uart_id: twc_uart
  # MAX485: DE och RE ihopkopplade hit. HIGH = sänd, LOW = lyssna.
  # Måste ligga här under twc_director:, inte under uart:.
  flow_control_pin: GPIO18
  addr: ${master_addr}
  global_max_current: ${global_max_current}
  global_twc_max_current: ${global_twc_max_current}
  global_max_current_control:
    id: cap_global_max
    name: "cap global max"
  master_mode:
    id: td_master_mode
    name: "td master mode"
  charging_count:
    name: "twc charging count"
  link_ok:
    name: "twc link ok"
  evse:
    - name: ${twc_0_name}
      twc_online:
        name: "${twc_0_name} twc online"
      charge_status:
        name: "${twc_0_name} twc charge status"
      charge_status_text:
        name: "${twc_0_name} twc charge status text"
      charging:
        name: "${twc_0_name} twc charging"
      power:
        name: "${twc_0_name} twc power"
      meter_current_phase_a:
        name: "${twc_0_name} twc current l1"
      meter_current_phase_b:
        name: "${twc_0_name} twc current l2"
      meter_current_phase_c:
        name: "${twc_0_name} twc current l3"
      meter_voltage_phase_a:
        name: "${twc_0_name} twc voltage l1"
      meter_voltage_phase_b:
        name: "${twc_0_name} twc voltage l2"
      meter_voltage_phase_c:
        name: "${twc_0_name} twc voltage l3"
      meter_energy_total:
        name: "${twc_0_name} twc energy total"
      meter_energy_session:
        name: "${twc_0_name} twc energy session"
      vehicle_connected:
        name: "${twc_0_name} twc vehicle connected"
      vehicle_vin:
        name: "${twc_0_name} twc vin"
      firmware_version:
        name: "${twc_0_name} twc firmware"
      serial_number:
        name: "${twc_0_name} twc serial"
      mode:
        name: "${twc_0_name} twc mode"
      status_text:
        name: "${twc_0_name} twc status raw"
      status_log:
        name: "${twc_0_name} twc status log"
      contactor_status:
        name: "${twc_0_name} twc contactor closed"
      available_current_sensor:
        name: "${twc_0_name} twc available current"
      max_current_sensor:
        name: "${twc_0_name} twc max current"
      session_current_sensor:
        name: "${twc_0_name} twc session current"
      charge_enable:
        id: twc_0_evcc_charge_enable
        name: "${twc_0_name} evcc charge enable"
      offered_current:
        id: twc_0_evcc_offered_current
        name: "${twc_0_name} evcc offered current"
      evcc_watchdog_ok:
        name: "${twc_0_name} td evcc watchdog ok"
      max_current:
        id: twc_0_cap_max_current
        name: "${twc_0_name} cap max current"
      initial_current:
        id: twc_0_cap_initial_current
        name: "${twc_0_name} cap initial current"
      enable:
        name: "${twc_0_name} td bus enable"
      contactor:
        name: "${twc_0_name} td contactor"

    - name: ${twc_1_name}
      # samma nycklar som Slot 0, med twc_1_* id:n
      twc_online:
        name: "${twc_1_name} twc online"
      charge_status:
        name: "${twc_1_name} twc charge status"
      charge_status_text:
        name: "${twc_1_name} twc charge status text"
      charging:
        name: "${twc_1_name} twc charging"
      power:
        name: "${twc_1_name} twc power"
      meter_current_phase_a:
        name: "${twc_1_name} twc current l1"
      meter_current_phase_b:
        name: "${twc_1_name} twc current l2"
      meter_current_phase_c:
        name: "${twc_1_name} twc current l3"
      meter_voltage_phase_a:
        name: "${twc_1_name} twc voltage l1"
      meter_voltage_phase_b:
        name: "${twc_1_name} twc voltage l2"
      meter_voltage_phase_c:
        name: "${twc_1_name} twc voltage l3"
      meter_energy_total:
        name: "${twc_1_name} twc energy total"
      meter_energy_session:
        name: "${twc_1_name} twc energy session"
      vehicle_connected:
        name: "${twc_1_name} twc vehicle connected"
      vehicle_vin:
        name: "${twc_1_name} twc vin"
      firmware_version:
        name: "${twc_1_name} twc firmware"
      serial_number:
        name: "${twc_1_name} twc serial"
      mode:
        name: "${twc_1_name} twc mode"
      status_text:
        name: "${twc_1_name} twc status raw"
      status_log:
        name: "${twc_1_name} twc status log"
      contactor_status:
        name: "${twc_1_name} twc contactor closed"
      available_current_sensor:
        name: "${twc_1_name} twc available current"
      max_current_sensor:
        name: "${twc_1_name} twc max current"
      session_current_sensor:
        name: "${twc_1_name} twc session current"
      charge_enable:
        id: twc_1_evcc_charge_enable
        name: "${twc_1_name} evcc charge enable"
      offered_current:
        id: twc_1_evcc_offered_current
        name: "${twc_1_name} evcc offered current"
      evcc_watchdog_ok:
        name: "${twc_1_name} td evcc watchdog ok"
      max_current:
        id: twc_1_cap_max_current
        name: "${twc_1_name} cap max current"
      initial_current:
