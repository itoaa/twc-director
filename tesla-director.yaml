# tesla-director.yaml

substitutions:
  global_max_current: "48"      # cap: total circuit budget for all TWC
  global_twc_max_current: "32"  # cap: per-TWC hardware/cable limit
  master_addr: "0xF00D"         # TWC director address on RS-485
  twc_0_name: "Slot 0"
  twc_0_initial_current: "15"
  twc_0_max_current: "32"
  twc_1_name: "Slot 1"
  twc_1_initial_current: "15"
  twc_1_max_current: "32"

esphome:
  name: tesla-director
  friendly_name: Tesla-Director
  project:
    name: "twc-director.Tesla Wall Connector Director"
    version: "v0.3.0"
  on_boot:
    priority: 200
    then:
      - output.turn_on: tcan485_boost_en        # GPIO16, 5V boost power
      - output.turn_on: tcan485_rs485_shutdown  # GPIO19, shutdown disable (HIGH = enable)
      - output.turn_on: tcan485_rs485_re        # GPIO17, MAX13487E receive enable (inte MAX485)
      - delay: 100ms                            # Let RS-485 transceiver stabilize
      # Safety: do NOT auto-enable master mode. Turn on "td master mode" in HA
      # only when the bus is ready. evcc offered current stays 0 until evcc writes.
      - number.set:
          id: twc_0_cap_max_current
          value: ${twc_0_max_current}
      - number.set:
          id: twc_0_cap_initial_current
          value: ${twc_0_initial_current}
      - number.set:
          id: twc_1_cap_max_current
          value: ${twc_1_max_current}
      - number.set:
          id: twc_1_cap_initial_current
          value: ${twc_1_initial_current}
  on_shutdown:
    then:
      - output.turn_off: tcan485_boost_en       # Disable GPIO16 before reset to avoid boot hang

esp32:
  board: esp32dev
  framework:
    type: esp-idf
  # ESPHome 2026.7+ uses native ESP-IDF toolchain by default.
  # Uncomment if compile fails with the native toolchain:
  # toolchain: platformio

# Local component tree in this repo (preferred for development).
# For HA Device Builder after push, switch to git source pointing at your fork:
# external_components:
#   - source:
#       type: git
#       url: https://github.com/itoaa/twc-director.git
external_components:
  - source:
      type: local
      path: components

logger:
  level: VERBOSE
  initial_level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret tesla_director_api_key

ota:
  - platform: esphome
    password: !secret tesla_director_ota_password

safe_mode:
  boot_is_good_after: 60s
  num_attempts: 5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Tesla-Director Fallback Hotspot"
    password: !secret wifi_hotspot_password

# Web UI over plain HTTP only (ESPHome has no built-in HTTPS on the device).
# Do NOT enable auth: on HTTP — Basic/Digest credentials or challenges still
# travel on an unencrypted channel; Basic even puts the password in Base64.
# Prefer: no auth + trusted LAN / IoT VLAN, or terminate TLS at a reverse proxy
# and put auth there. See README "Web UI security".
web_server:
  port: 80
  # auth:   # only if you terminate HTTPS in front of the device
  #   type: digest
  #   username: !secret web_username
  #   password: !secret web_password

captive_portal:
    
# UART on the RS-485 transceiver
uart:
  id: twc_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  stop_bits: 1
  parity: NONE

output:
  # Boost power supply enable (BOOST_ENABLE_PIN 16)
  - platform: gpio
    id: tcan485_boost_en
    pin: GPIO16

  # MAX13487E shutdown pin (RS485_SHUTDOWN_PIN 19) - HIGH = enable
  - platform: gpio
    id: tcan485_rs485_shutdown
    pin: GPIO19

  # MAX13487E RE pin (RS485_RE_PIN 17) — HIGH = receive enable
  - platform: gpio
    id: tcan485_rs485_re
    pin: GPIO17

select:
  - platform: logger
    name: Tesla Director log level
    disabled_by_default: true

twc_director:
  id: twc_component
  uart_id: twc_uart
  # MAX485: knyt DE och RE ihop och hit. HIGH=sänd, LOW=lyssna.
  # MAX13487E/TCAN485: ta bort den här raden (auto-direction).
  flow_control_pin: GPIO18
  addr: ${master_addr}
  global_max_current: ${global_max_current}
  global_twc_max_current: ${global_twc_max_current}
  global_max_current_control:
    id: cap_global_max
    name: "cap global max"
  master_mode:
    id: td_master_mode
    name: "td master mode"
  charging_count:
    name: "twc charging count"
  link_ok:
    name: "twc link ok"
  evse:
