      charge_enable:
        id: twc_0_evcc_charge_enable
        name: "${twc_0_name} evcc charge enable"
      offered_current:
        id: twc_0_evcc_offered_current
        name: "${twc_0_name} evcc offered current"
      evcc_watchdog_ok:
