# tesla-director.yaml
#
# Reference config for the setup this firmware is developed on:
#   Wemos D1 mini ESP32 + MAX485 module (3.3 V), 2x Gen2 Tesla Wall Connector (3-phase, Sweden)
#
#   ESP32 GPIO22 (TX) -> MAX485 DI
#   ESP32 GPIO21 (RX) <- MAX485 RO
#   ESP32 GPIO18      -> MAX485 DE + RE (tied together)  == twc_director: flow_control_pin
#   MAX485 VCC = 3.3 V, GND shared with the Wall Connectors, A/B to TWC A/B (120 ohm at bus ends)
#
# Do NOT use GPIO1 / GPIO3 for RS-485: they are UART0 (USB serial / boot log) and the
# USB-UART chip drives them, which corrupts frames (checksum errors).
#
# flow_control_pin belongs under twc_director:, NOT under uart:.
#
# Using a LilyGO T-CAN485 instead? See tesla-director-safe.yaml (it keeps the
# GPIO16/17/19 power/enable outputs and omits flow_control_pin).
#
# Secrets: copy secrets.yaml.example to secrets.yaml and fill in real values.

substitutions:
  global_max_current: "15"      # cap: hela slingan (säkring minus marginal)
  global_twc_max_current: "15"  # cap: per TWC (kabel/box)
  master_addr: "0xF00D"
  # Wall Connector RS-485 addresses = last 4 digits of the serial (A20J0149983 -> 0x9983).
  # Fixed so that twc_0/twc_1 (and evcc loadpoint 0/1) always map to the same box and the
  # cap_* defaults below can be applied at boot. Find yours in the log: "TWC 0x....".
  twc_0_address: "0x9983"   # serial A20J0149983
  twc_0_name: "S22 Garage Inne"
  twc_0_initial_current: "6"
  twc_0_max_current: "15"
  twc_1_address: "0x8988"   # serial A19E0108988
  twc_1_name: "S22 Garage Ute"
  twc_1_initial_current: "6"
  twc_1_max_current: "15"

esphome:
  name: tesla-director
  friendly_name: Tesla-Director
  # Each Wall Connector is its own Home Assistant device (ESPHome ≥ 2025.7).
  # Per-box entity names are short ("evcc current limit"); the box name comes
  # from the sub-device. Global entities stay on Tesla-Director.
  devices:
    - id: twc_0_device
      name: ${twc_0_name}
    - id: twc_1_device
      name: ${twc_1_name}
  project:
    name: "twc-director.Tesla Wall Connector Director"
    version: "v0.3.0"
  on_boot:
    priority: 200
    then:
      # Master mode startar PÅ vid boot (restore_mode ALWAYS_ON): boxarna behöver
      # masterns heartbeats för att starta. Säkerhet: evcc current limit startar på
      # 0 A och evcc charging enabled är AV tills evcc skriver.
      - number.set:
          id: twc_0_cap_max_current
          value: ${twc_0_max_current}
      - number.set:
          id: twc_0_cap_initial_current
          value: ${twc_0_initial_current}
      - number.set:
          id: twc_1_cap_max_current
          value: ${twc_1_max_current}
      - number.set:
          id: twc_1_cap_initial_current
          value: ${twc_1_initial_current}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/itoaa/twc-director.git
      ref: main
    components: [twc_director]
    refresh: 0s
  # Local checkout instead (development):
  # - source:
  #     type: local
  #     path: components

logger:
  level: VERBOSE        # compile-time ceiling; change at runtime with the "diag log level" select
  initial_level: INFO
  baud_rate: 0          # UART0 is not used for logging (keeps GPIO1/3 free)

select:
  - platform: logger
    name: "diag log level"
    entity_category: diagnostic

api:
  encryption:
    key: !secret tesla_director_api_key

ota:
  - platform: esphome
    password: !secret tesla_director_ota_password

safe_mode:
  boot_is_good_after: 60s
  num_attempts: 5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tesla-Director Fallback Hotspot"
    password: !secret wifi_hotspot_password

# Produktion: ta bort web_server (se tesla-director-safe.yaml).
# Aktivera aldrig auth: över vanlig HTTP, se README "Web UI security".
web_server:
  port: 80

captive_portal:

sensor:
  - platform: uptime
    name: "Uptime"

  - platform: wifi_signal
    id: wifi_signal_sensor
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: template
    name: "WiFi Strength"
    lambda: |-
      if (id(wifi_signal_sensor).state > -55)  return {"Excellent"};
      else if (id(wifi_signal_sensor).state > -70) return {"Good"};
      else if (id(wifi_signal_sensor).state > -85) return {"OK"};
      else return {"Weak"};
    update_interval: 60s
    icon: "mdi:wifi"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    mac_address:
      name: "MAC Address"

# D1 mini ESP32 + MAX485: DI=GPIO22, RO=GPIO21, DE+RE=GPIO18, VCC=3,3 V
# (no flow_control_pin here - it goes under twc_director:)
uart:
  id: twc_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  stop_bits: 1
  parity: NONE

twc_director:
  id: twc_component
  uart_id: twc_uart
  # MAX485: DE och RE ihopkopplade hit. HIGH = sänd, LOW = lyssna.
  # Måste ligga här under twc_director:, inte under uart:.
  flow_control_pin: GPIO18
  # evcc's Home Assistant charger writes enable/maxcurrent only when they change, so the
  # watchdog is OFF by default. Set e.g. 300s only if something rewrites them regularly.
  evcc_watchdog_timeout: 0s
  # Switch in HA: per-frame RX:/TX:/"Sending E0" logs at INFO when ON (default OFF).
  rs485_debug:
    name: "diag rs485 logging"
  addr: ${master_addr}
  global_max_current: ${global_max_current}
  global_twc_max_current: ${global_twc_max_current}
  global_max_current_control:
    id: cap_global_max
    name: "limit global max current"
  master_mode:
    id: td_master_mode
    name: "system master mode"
    restore_mode: ALWAYS_ON   # default; RESTORE_DEFAULT_ON = kom ihåg senaste läget
  charging_count:
    name: "system charging count"
  link_ok:
    name: "system link ok"
  evse:
    - name: ${twc_0_name}
      address: ${twc_0_address}
      device_id: twc_0_device
      twc_online:
        name: "state online"
      charge_status:
        name: "state charge"
      charge_status_text:
        name: "state charge text"
      charging:
        name: "state charging"
      power:
        name: "meter power"
      meter_current_phase_a:
        name: "meter current L1"
      meter_current_phase_b:
        name: "meter current L2"
      meter_current_phase_c:
        name: "meter current L3"
      meter_voltage_phase_a:
        name: "meter voltage L1"
      meter_voltage_phase_b:
        name: "meter voltage L2"
      meter_voltage_phase_c:
        name: "meter voltage L3"
      meter_energy_total:
        name: "meter energy total"
      meter_energy_session:
        name: "meter energy session"
      vehicle_connected:
        name: "state car connected"
      vehicle_vin:
        name: "state VIN"
      firmware_version:
        name: "info firmware"
      serial_number:
        name: "info serial number"
      mode:
        name: "state mode"
      status_text:
        name: "diag state raw"
      status_log:
        name: "diag state log"
      contactor_status:
        name: "state contactor closed"
      available_current_sensor:
        name: "diag current offered by box"
      max_current_sensor:
        name: "diag max current reported by box"
      session_current_sensor:
        name: "meter current max phase"
      setpoint_sent_sensor:
        name: "diag current limit sent"
      charge_enable:
        id: twc_0_evcc_charge_enable
        name: "evcc charging enabled"
      offered_current:
        id: twc_0_evcc_offered_current
        name: "evcc current limit"
      evcc_watchdog_ok:
        name: "diag watchdog ok"
      max_current:
        id: twc_0_cap_max_current
        name: "limit max current"
      initial_current:
        id: twc_0_cap_initial_current
        name: "local start current"
      enable:
        name: "system bus enabled"
      contactor:
        name: "diag contactor"

    - name: ${twc_1_name}
      address: ${twc_1_address}
      device_id: twc_1_device
      # same keys as twc_0, med twc_1_* id:n
      twc_online:
        name: "state online"
      charge_status:
        name: "state charge"
      charge_status_text:
        name: "state charge text"
      charging:
        name: "state charging"
      power:
        name: "meter power"
      meter_current_phase_a:
        name: "meter current L1"
      meter_current_phase_b:
        name: "meter current L2"
      meter_current_phase_c:
        name: "meter current L3"
      meter_voltage_phase_a:
        name: "meter voltage L1"
      meter_voltage_phase_b:
        name: "meter voltage L2"
      meter_voltage_phase_c:
        name: "meter voltage L3"
      meter_energy_total:
        name: "meter energy total"
      meter_energy_session:
        name: "meter energy session"
      vehicle_connected:
        name: "state car connected"
      vehicle_vin:
        name: "state VIN"
      firmware_version:
        name: "info firmware"
      serial_number:
        name: "info serial number"
      mode:
        name: "state mode"
      status_text:
        name: "diag state raw"
      status_log:
        name: "diag state log"
      contactor_status:
        name: "state contactor closed"
      available_current_sensor:
        name: "diag current offered by box"
      max_current_sensor:
        name: "diag max current reported by box"
      session_current_sensor:
        name: "meter current max phase"
      setpoint_sent_sensor:
        name: "diag current limit sent"
      charge_enable:
        id: twc_1_evcc_charge_enable
        name: "evcc charging enabled"
      offered_current:
        id: twc_1_evcc_offered_current
        name: "evcc current limit"
      evcc_watchdog_ok:
        name: "diag watchdog ok"
      max_current:
        id: twc_1_cap_max_current
        name: "limit max current"
      initial_current:
        id: twc_1_cap_initial_current
        name: "local start current"
      enable:
        name: "system bus enabled"
      contactor:
        name: "diag contactor"
