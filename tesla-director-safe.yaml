        name: "${twc_1_name} state charge text"
      charging:
        name: "${twc_1_name} state charging"
      power:
        name: "${twc_1_name} meter power"
      meter_current_phase_a:
        name: "${twc_1_name} meter current L1"
      meter_current_phase_b:
        name: "${twc_1_name} meter current L2"
      meter_current_phase_c:
        name: "${twc_1_name} meter current L3"
      meter_voltage_phase_a:
        name: "${twc_1_name} meter voltage L1"
      meter_voltage_phase_b:
        name: "${twc_1_name} meter voltage L2"
      meter_voltage_phase_c:
        name: "${twc_1_name} meter voltage L3"
      meter_energy_total:
        name: "${twc_1_name} meter energy total"
      meter_energy_session:
