# tesla-director-safe.yaml
#
# Hardened profile: no web UI control surface, master mode off by default,
# explicit safety currents. Prefer this for production; use HA API for control.
#
# Copy secrets from secrets.yaml.example. Set global_max_current to your
# installation breaker rating (minus margin), not an aspirational value.

substitutions:
  global_max_current: "32"      # cap: total circuit budget (amps)
  global_twc_max_current: "16"  # cap: per-TWC hardware/cable limit
  master_addr: "0xF00D"
  twc_0_name: "Slot 0"
  twc_0_initial_current: "6"
  twc_0_max_current: "16"
  twc_1_name: "Slot 1"
  twc_1_initial_current: "6"
  twc_1_max_current: "16"

esphome:
  name: tesla-director
  friendly_name: Tesla-Director
  project:
    name: "twc-director.Tesla Wall Connector Director"
    version: "v0.2.0-safe"
  on_boot:
    priority: 200
    then:
      - output.turn_on: tcan485_boost_en
      - output.turn_on: tcan485_rs485_shutdown
      - output.turn_on: tcan485_rs485_re
      - delay: 100ms
      # Master mode stays OFF until you enable it in Home Assistant.
      - number.set:
          id: twc_0_cap_max_current
          value: ${twc_0_max_current}
      - number.set:
          id: twc_0_cap_initial_current
          value: ${twc_0_initial_current}
      - number.set:
          id: twc_1_cap_max_current
          value: ${twc_1_max_current}
      - number.set:
          id: twc_1_cap_initial_current
          value: ${twc_1_initial_current}
  on_shutdown:
    then:
      - output.turn_off: tcan485_boost_en

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
  # Production (HA Device Builder):
  # - source:
  #     type: git
  #     url: https://github.com/itoaa/twc-director.git
  #     ref: main

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret tesla_director_api_key

ota:
  - platform: esphome
    password: !secret tesla_director_ota_password

safe_mode:
  boot_is_good_after: 60s
  num_attempts: 5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tesla-Director Fallback Hotspot"
    password: !secret wifi_hotspot_password

# No web_server: control only via encrypted Home Assistant API.
# Captive portal remains for WiFi recovery only.
captive_portal:

uart:
  id: twc_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  stop_bits: 1
  parity: NONE

output:
  - platform: gpio
    id: tcan485_boost_en
    pin: GPIO16
  - platform: gpio
    id: tcan485_rs485_shutdown
    pin: GPIO19
  - platform: gpio
    id: tcan485_rs485_re
    pin: GPIO17

twc_director:
  id: twc_component
  uart_id: twc_uart
  flow_control_pin: GPIO18
  addr: ${master_addr}
  global_max_current: ${global_max_current}
  global_twc_max_current: ${global_twc_max_current}
  global_max_current_control:
    id: cap_global_max
    name: "cap global max"
  master_mode:
    id: td_master_mode
    name: "td master mode"
  charging_count:
    name: "twc charging count"
  link_ok:
    name: "twc link ok"
  evse:
