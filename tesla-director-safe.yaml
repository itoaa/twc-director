# tesla-director-safe.yaml
#
# Hardened profile: no web UI control surface, master mode ON at boot (heartbeats required), evcc setpoints start at 0 A / OFF,
# explicit safety currents. Prefer this for production; use HA API for control.
#
# Copy secrets from secrets.yaml.example. Set global_max_current to your
# installation breaker rating (minus margin), not an aspirational value.

substitutions:
  global_max_current: "32"      # cap: total circuit budget (amps)
  global_twc_max_current: "16"  # cap: per-TWC hardware/cable limit
  master_addr: "0xF00D"
  # Wall Connector RS-485 addresses = last 4 digits of the serial (A20J0149983 -> 0x9983).
  # Fixed so that twc_0/twc_1 (and evcc loadpoint 0/1) always map to the same box and the
  # cap_* defaults below can be applied at boot. Find yours in the log: "TWC 0x....".
  twc_0_address: "0x9983"   # serial A20J0149983
  twc_0_name: "S22 Garage Inne"
  twc_0_initial_current: "6"
  twc_0_max_current: "16"
  twc_1_address: "0x8988"   # serial A19E0108988
  twc_1_name: "S22 Garage Ute"
  twc_1_initial_current: "6"
  twc_1_max_current: "16"

esphome:
  name: tesla-director
  friendly_name: Tesla-Director
  project:
    name: "twc-director.Tesla Wall Connector Director"
    version: "v0.2.0-safe"
  on_boot:
    priority: 200
    then:
      # Master mode starts ON at boot (restore_mode ALWAYS_ON): the Wall Connectors need
      # the master's heartbeats to start. evcc current limit still starts at 0 A and
      # evcc charging enabled OFF until evcc writes.
      - number.set:
          id: twc_0_cap_max_current
          value: ${twc_0_max_current}
      - number.set:
          id: twc_0_cap_initial_current
          value: ${twc_0_initial_current}
      - number.set:
          id: twc_1_cap_max_current
          value: ${twc_1_max_current}
      - number.set:
          id: twc_1_cap_initial_current
          value: ${twc_1_initial_current}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
  # Production (HA Device Builder):
  # - source:
  #     type: git
  #     url: https://github.com/itoaa/twc-director.git
  #     ref: main

logger:
  level: VERBOSE        # compile-time ceiling; change at runtime with the "diag log level" select
  initial_level: INFO
  baud_rate: 0          # UART0 is not used for logging (keeps GPIO1/3 free)

select:
  - platform: logger
    name: "diag log level"
    entity_category: diagnostic

api:
  encryption:
    key: !secret tesla_director_api_key

ota:
  - platform: esphome
    password: !secret tesla_director_ota_password

safe_mode:
  boot_is_good_after: 60s
  num_attempts: 5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tesla-Director Fallback Hotspot"
    password: !secret wifi_hotspot_password

# No web_server: control only via encrypted Home Assistant API.
# Captive portal remains for WiFi recovery only.
captive_portal:

# D1 mini ESP32 + MAX485 (3.3 V): DI=GPIO22, RO=GPIO21, DE+RE=GPIO18.
# Never use GPIO1/GPIO3 (UART0 / USB chip) for RS-485.
uart:
  id: twc_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  stop_bits: 1
  parity: NONE

twc_director:
  id: twc_component
  uart_id: twc_uart
  # MAX485 DE+RE tied together. Belongs under twc_director:, not under uart:.
  flow_control_pin: GPIO18
  # evcc's Home Assistant charger writes enable/maxcurrent only when they change, so the
  # watchdog is OFF by default. Set e.g. 300s only if something rewrites them regularly.
  evcc_watchdog_timeout: 0s
  # Switch in HA: per-frame RX:/TX:/"Sending E0" logs at INFO when ON (default OFF).
  rs485_debug:
    name: "diag rs485 logging"
  addr: ${master_addr}
  global_max_current: ${global_max_current}
  global_twc_max_current: ${global_twc_max_current}
  global_max_current_control:
    id: cap_global_max
    name: "limit global max current"
  master_mode:
    id: td_master_mode
    name: "system master mode"
    restore_mode: ALWAYS_ON
  charging_count:
    name: "system charging count"
  link_ok:
    name: "system link ok"
  evse:
    - name: ${twc_0_name}
      address: ${twc_0_address}
      twc_online:
        name: "${twc_0_name} state online"
      charge_status:
        name: "${twc_0_name} state charge"
      charge_status_text:
        name: "${twc_0_name} state charge text"
      charging:
        name: "${twc_0_name} state charging"
      power:
        name: "${twc_0_name} meter power"
      meter_current_phase_a:
        name: "${twc_0_name} meter current L1"
      meter_current_phase_b:
        name: "${twc_0_name} meter current L2"
      meter_current_phase_c:
        name: "${twc_0_name} meter current L3"
      meter_voltage_phase_a:
        name: "${twc_0_name} meter voltage L1"
      meter_voltage_phase_b:
        name: "${twc_0_name} meter voltage L2"
      meter_voltage_phase_c:
        name: "${twc_0_name} meter voltage L3"
      meter_energy_total:
        name: "${twc_0_name} meter energy total"
      meter_energy_session:
        name: "${twc_0_name} meter energy session"
      vehicle_connected:
        name: "${twc_0_name} state car connected"
      vehicle_vin:
        name: "${twc_0_name} state VIN"
      firmware_version:
        name: "${twc_0_name} info firmware"
      serial_number:
        name: "${twc_0_name} info serial number"
      mode:
        name: "${twc_0_name} state mode"
      status_text:
        name: "${twc_0_name} diag state raw"
      status_log:
        name: "${twc_0_name} diag state log"
      contactor_status:
        name: "${twc_0_name} state contactor closed"
      available_current_sensor:
        name: "${twc_0_name} diag current offered by box"
      max_current_sensor:
        name: "${twc_0_name} diag max current reported by box"
      session_current_sensor:
        name: "${twc_0_name} diag current setpoint sent"
      charge_enable:
        id: twc_0_evcc_charge_enable
        name: "${twc_0_name} evcc charging enabled"
      offered_current:
        id: twc_0_evcc_offered_current
        name: "${twc_0_name} evcc current limit"
      evcc_watchdog_ok:
        name: "${twc_0_name} diag watchdog ok"
      max_current:
        id: twc_0_cap_max_current
        name: "${twc_0_name} limit max current"
      initial_current:
        id: twc_0_cap_initial_current
        name: "${twc_0_name} local start current"
      enable:
        name: "${twc_0_name} system bus enabled"
      contactor:
        name: "${twc_0_name} diag contactor"

    - name: ${twc_1_name}
      address: ${twc_1_address}
      twc_online:
