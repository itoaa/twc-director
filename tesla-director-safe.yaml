# tesla-director-safe.yaml
#
# Hardened profile: no web UI control surface, master mode off by default,
# explicit safety currents. Prefer this for production; use HA API for control.
#
# Copy secrets from secrets.yaml.example. Set global_max_current to your
# installation breaker rating (minus margin), not an aspirational value.

substitutions:
  global_max_current: "32"      # Total circuit budget (amps) — REQUIRED safety limit
  global_twc_max_current: "16"  # Per-TWC hardware/cable limit
  master_addr: "0xF00D"
  twc_0_name: "Garage"
  twc_0_initial_current: "6"    # Conservative start allocation
  twc_0_max_current: "16"

esphome:
  name: tesla-director
  friendly_name: Tesla-Director
  project:
    name: "twc-director.Tesla Wall Connector Director"
    version: "v0.2.0-safe"
  on_boot:
    priority: 200
    then:
      - output.turn_on: tcan485_boost_en
      - output.turn_on: tcan485_rs485_shutdown
      - output.turn_on: tcan485_rs485_re
      - delay: 100ms
      # Master mode stays OFF until you enable it in Home Assistant.
      - number.set:
          id: twc_0_max_current_num
          value: ${twc_0_max_current}
      - number.set:
          id: twc_0_initial_current_num
          value: ${twc_0_initial_current}
  on_shutdown:
    then:
      - output.turn_off: tcan485_boost_en

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
  # Production (HA Device Builder):
  # - source:
  #     type: git
  #     url: https://github.com/itoaa/twc-director.git
  #     ref: main

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret tesla_director_api_key

ota:
  - platform: esphome
    password: !secret tesla_director_ota_password

safe_mode:
  boot_is_good_after: 60s
  num_attempts: 5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tesla-Director Fallback Hotspot"
    password: !secret wifi_hotspot_password

# No web_server: control only via encrypted Home Assistant API.
# Captive portal remains for WiFi recovery only.
captive_portal:

uart:
  id: twc_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  stop_bits: 1
  parity: NONE

output:
  - platform: gpio
    id: tcan485_boost_en
    pin: GPIO16
  - platform: gpio
    id: tcan485_rs485_shutdown
    pin: GPIO19
  - platform: gpio
    id: tcan485_rs485_re
    pin: GPIO17

twc_director:
  id: twc_component
  uart_id: twc_uart
  addr: ${master_addr}
  global_max_current: ${global_max_current}
  global_twc_max_current: ${global_twc_max_current}
  master_mode:
    id: twc_master_mode
  charging_count:
  link_ok:
    name: RS-485 Link
  evse:
    - name: ${twc_0_name}
      twc_online:
      firmware_version:
      meter_current_phase_a:
        name: ${twc_0_name} Current
      meter_current_phase_b:
        disabled_by_default: true
      meter_current_phase_c:
        disabled_by_default: true
      meter_energy_session:
      meter_energy_total:
      meter_voltage_phase_a:
        name: ${twc_0_name} Voltage
      meter_voltage_phase_b:
        disabled_by_default: true
      meter_voltage_phase_c:
        disabled_by_default: true
      serial_number:
      vehicle_connected:
      vehicle_vin:
      contactor:
      contactor_status:
      available_current_sensor:
      max_current:
        id: twc_0_max_current_num
      max_current_sensor:
      initial_current:
        id: twc_0_initial_current_num
      session_current:
      session_current_sensor:
      mode:
      status_text:
      status_log:
      enable:
